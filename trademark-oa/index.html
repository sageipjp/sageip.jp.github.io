<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商標OA 条文検索</title>
<style>
:root{--blue:#1559a6;--blue2:#eaf3ff;--line:#d8e1ea;--text:#1f2933;--muted:#657789;--bg:#f6f8fb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--line)}
.header-inner{max-width:980px;margin:auto;padding:22px 18px 18px}
h1{margin:0;color:var(--blue);font-size:25px}.sub{margin-top:6px;color:var(--muted);font-size:13px}
main{max-width:980px;margin:24px auto 60px;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
label{display:block;font-weight:700;margin-bottom:8px}select,input{width:100%;font-size:16px;padding:11px 12px;border:1px solid #b9c6d4;border-radius:7px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:6px;padding:9px 12px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--blue);color:#fff}.secondary{background:var(--blue2);color:var(--blue)}
.stat{font-size:14px;color:var(--muted);margin-top:10px}.result-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.result-title{font-size:22px;font-weight:700;color:var(--blue)}.count{font-size:14px;color:var(--muted)}
.app-list{border-top:1px solid var(--line)}.app-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}.appnum{font-family:Consolas,"Courier New",monospace;font-size:15px}.row-actions{display:flex;gap:6px;flex-shrink:0}.row-actions button{padding:6px 9px}
.pager{display:flex;justify-content:center;gap:8px;margin-top:16px;align-items:center}.notice{font-size:12px;line-height:1.65;color:var(--muted)}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#1f2d3d;color:#fff;padding:10px 14px;border-radius:7px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="header-inner"><h1>商標OA 条文検索</h1><div class="sub">商標の拒絶理由通知を、適用条文から検索できます。</div></div></header>
<main>
  <section class="card">
    <div class="grid">
      <div><label for="articleSelect">条文から探す</label><select id="articleSelect"><option value="">選択してください</option></select></div>
      <div><label for="appSearch">願番から探す</label><input id="appSearch" inputmode="numeric" placeholder="例：2026001234"></div>
    </div>
    <div class="stat" id="meta">データ読込中…</div>
  </section>

  <section id="articleResult" class="card hidden">
    <div class="result-head">
      <div><div class="result-title" id="articleTitle"></div><div class="count" id="articleCount"></div></div>
      <div class="actions"><button class="secondary" id="copyAll">表示中の願番をコピー</button><a class="btn primary" href="https://www.j-platpat.inpit.go.jp/" target="_blank" rel="noopener">J-PlatPatを開く</a></div>
    </div>
    <div id="appList" class="app-list"></div><div id="pager" class="pager"></div>
  </section>

  <section id="appResult" class="card hidden">
    <div class="result-title">願番検索結果</div><div id="appResultBody" style="margin-top:12px"></div>
    <div class="actions"><a class="btn primary" href="https://www.j-platpat.inpit.go.jp/" target="_blank" rel="noopener">J-PlatPatを開く</a></div>
  </section>

  <section class="card notice"><div id="dataNote"></div><div style="margin-top:8px">願番をコピーして、J-PlatPatで詳細をご確認ください。このページはJ-PlatPatとは独立した検索補助ページです。</div></section>
</main>
<div class="toast" id="toast">コピーしました</div>
<script>
const DATA_URL="oa_articles.json", PAGE_SIZE=100;let DATA=null,currentApps=[],currentPage=1;
function showToast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)}
async function copyText(t){try{await navigator.clipboard.writeText(t);showToast("コピーしました")}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();showToast("コピーしました")}}
function tuple(c){if(c.startsWith("68→6-")){return[68,99,parseInt(c.split("-").pop(),10)||0]}return c.split("-").map(x=>x==="柱"?999:(parseInt(x,10)||0))}
function cmp(a,b){const A=tuple(a),B=tuple(b),n=Math.max(A.length,B.length);for(let i=0;i<n;i++){const x=A[i]??0,y=B[i]??0;if(x!==y)return x-y}return a.localeCompare(b,"ja")}
function populateSelect(){const s=document.getElementById("articleSelect");Object.keys(DATA.articles).sort(cmp).forEach(code=>{const i=DATA.articles[code],o=document.createElement("option");o.value=code;o.textContent=`${code}  (${i.count.toLocaleString()}件)`;o.title=i.full;s.appendChild(o)})}
function renderArticle(code){const b=document.getElementById("articleResult");if(!code||!DATA.articles[code]){b.classList.add("hidden");return}const i=DATA.articles[code];currentApps=i.apps;currentPage=1;document.getElementById("articleTitle").textContent=code;document.getElementById("articleCount").textContent=`該当 ${i.count.toLocaleString()}件`;b.classList.remove("hidden");renderPage()}
function renderPage(){const list=document.getElementById("appList");list.innerHTML="";const st=(currentPage-1)*PAGE_SIZE,en=Math.min(st+PAGE_SIZE,currentApps.length);currentApps.slice(st,en).forEach(app=>{const r=document.createElement("div");r.className="app-row";const n=document.createElement("div");n.className="appnum";n.textContent=app;const a=document.createElement("div");a.className="row-actions";const c=document.createElement("button");c.className="secondary";c.textContent="コピー";c.onclick=()=>copyText(app);a.appendChild(c);r.append(n,a);list.appendChild(r)});const p=document.getElementById("pager");p.innerHTML="";const pages=Math.ceil(currentApps.length/PAGE_SIZE);if(pages<=1)return;const prev=document.createElement("button");prev.className="secondary";prev.textContent="前へ";prev.disabled=currentPage===1;prev.onclick=()=>{currentPage--;renderPage()};const info=document.createElement("span");info.textContent=`${currentPage} / ${pages}`;const next=document.createElement("button");next.className="secondary";next.textContent="次へ";next.disabled=currentPage===pages;next.onclick=()=>{currentPage++;renderPage()};p.append(prev,info,next)}
function renderAppSearch(app){const b=document.getElementById("appResult"),body=document.getElementById("appResultBody");if(!app){b.classList.add("hidden");return}const i=DATA.applications[app];b.classList.remove("hidden");if(!i){body.innerHTML="<div>該当する願番は収録データにありません。</div>";return}const arts=i.articles||[],articleText=arts.length?arts.map(a=>`<button class="secondary" data-code="${a}" style="margin:3px">${a}</button>`).join(""):`<span style="color:#66778a">${i.note||"条文データなし"}</span>`;body.innerHTML=`<div><strong>願番：</strong><span class="appnum">${app}</span><button class="secondary" id="copyOne" style="margin-left:8px">コピー</button></div><div style="margin-top:10px"><strong>適用条文：</strong> ${articleText}</div>`;document.getElementById("copyOne").onclick=()=>copyText(app);body.querySelectorAll("[data-code]").forEach(btn=>btn.onclick=()=>{const code=btn.dataset.code;document.getElementById("articleSelect").value=code;renderArticle(code);document.getElementById("articleResult").scrollIntoView({behavior:"smooth"})})}
document.getElementById("articleSelect").onchange=e=>renderArticle(e.target.value);document.getElementById("appSearch").oninput=e=>{const app=e.target.value.replace(/\D/g,"");e.target.value=app;if(app.length>=8)renderAppSearch(app);else document.getElementById("appResult").classList.add("hidden")};document.getElementById("copyAll").onclick=()=>{const st=(currentPage-1)*PAGE_SIZE,en=Math.min(st+PAGE_SIZE,currentApps.length);copyText(currentApps.slice(st,en).join("\n"))};
fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error("JSON load failed");return r.json()}).then(data=>{DATA=data;populateSelect();const m=DATA.metadata;document.getElementById("meta").textContent=`収録 ${m.unique_applications.toLocaleString()}願番 / 条文集計可能 ${m.analyzable_oa.toLocaleString()}件 / ${m.period_start}～${m.period_end}`;document.getElementById("dataNote").textContent=m.note}).catch(err=>{document.getElementById("meta").textContent="データを読み込めませんでした。index.html と oa_articles.json が同じフォルダにあるか確認してください。";console.error(err)});
</script>
</body>
</html>
